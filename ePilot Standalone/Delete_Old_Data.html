<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer Chantiers Anciens</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 20px auto; padding: 20px; background: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 8px; }
        h1 { color: #c41e3a; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; font-weight: bold; }
        tr:hover { background: #f9f9f9; }
        input[type="checkbox"] { width: 20px; height: 20px; }
        .date-old { color: #c41e3a; font-weight: bold; }
        button { padding: 10px 20px; margin: 10px 5px 0 0; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .delete-btn { background: #c41e3a; color: white; }
        .delete-btn:hover { background: #a01729; }
        .info { background: #e3f2fd; padding: 15px; border-radius: 4px; margin: 20px 0; }
        .count { font-weight: bold; color: #c41e3a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ Supprimer Chantiers Anciens</h1>
        
        <div class="info">
            <strong>Sélectionnez les chantiers à supprimer:</strong><br>
            Cochez les lignes à supprimer, puis cliquez "Supprimer sélectionnés"
        </div>
        
        <div>
            <button class="delete-btn" onclick="deleteSelected()">🗑️ Supprimer sélectionnés</button>
            <button onclick="selectAll()">✓ Tout cocher</button>
            <button onclick="deselectAll()">✗ Tout décocher</button>
            <button onclick="location.reload()">↻ Rafraîchir</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAllCb" onchange="toggleSelectAll()"></th>
                    <th>Imputation</th>
                    <th>Date</th>
                    <th>Année</th>
                    <th>Statut</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5">Chargement...</td></tr>
            </tbody>
        </table>
        
        <div id="summary" style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 4px;"></div>
    </div>

    <script>
        let allJIP = [];
        
        window.onload = () => {
            try {
                const jipStr = localStorage.getItem('ePilot_JIP_DATA');
                if (!jipStr) {
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="5">❌ Aucune donnée JIP trouvée</td></tr>';
                    return;
                }
                
                allJIP = JSON.parse(jipStr);
                displayTable();
                showSummary();
            } catch (e) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5">❌ Erreur: ${e.message}</td></tr>`;
            }
        };
        
        function displayTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            allJIP.forEach((item, idx) => {
                const date = new Date(item.Date);
                const year = isNaN(date) ? 'N/A' : date.getFullYear();
                const isOld = year < 2025;
                const dateStr = isNaN(date) ? item.Date : date.toLocaleDateString('fr-FR');
                
                const row = `
                    <tr style="${isOld ? 'background: #fff3e0;' : ''}">
                        <td><input type="checkbox" class="row-check" data-index="${idx}" ${isOld ? 'checked' : ''}></td>
                        <td><strong>${item.Imputation}</strong></td>
                        <td>${dateStr}</td>
                        <td ${isOld ? 'class="date-old"' : ''}>${year}</td>
                        <td>${item.Type || '-'}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        
        function showSummary() {
            const old = allJIP.filter(item => {
                const date = new Date(item.Date);
                const year = isNaN(date) ? 9999 : date.getFullYear();
                return year < 2025;
            });
            
            const summary = document.getElementById('summary');
            summary.innerHTML = `
                <strong>Résumé:</strong><br>
                Total chantiers: <span class="count">${allJIP.length}</span><br>
                Avant 2025: <span class="count">${old.length}</span><br>
                À partir de 2025: <span class="count">${allJIP.length - old.length}</span>
            `;
        }
        
        function deleteSelected() {
            const checkboxes = document.querySelectorAll('.row-check:checked');
            if (!checkboxes.length) {
                alert('Sélectionnez au moins un chantier');
                return;
            }
            
            if (!confirm(`Supprimer ${checkboxes.length} chantier(s)? Cette action est irréversible!`)) {
                return;
            }
            
            const indices = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index)).sort((a, b) => b - a);
            indices.forEach(idx => {
                allJIP.splice(idx, 1);
            });
            
            localStorage.setItem('ePilot_JIP_DATA', JSON.stringify(allJIP));
            alert(`✓ ${indices.length} chantier(s) supprimé(s)!\n\nRafraîchissez V20 pour voir les changements.`);
            
            displayTable();
            showSummary();
        }
        
        function selectAll() {
            document.querySelectorAll('.row-check').forEach(cb => cb.checked = true);
        }
        
        function deselectAll() {
            document.querySelectorAll('.row-check').forEach(cb => cb.checked = false);
        }
        
        function toggleSelectAll() {
            const checked = document.getElementById('selectAllCb').checked;
            document.querySelectorAll('.row-check').forEach(cb => cb.checked = checked);
        }
    </script>
</body>
</html>
