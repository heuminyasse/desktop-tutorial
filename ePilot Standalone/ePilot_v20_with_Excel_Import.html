<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ePilot v20 - Import Excel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .modal { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 600px; width: 90%; }
  h1 { color: #1a1a1a; margin-bottom: 10px; font-size: 28px; }
  .subtitle { color: #666; margin-bottom: 25px; font-size: 14px; }
  .step { margin: 25px 0; }
  .step-title { font-weight: 600; color: #333; margin-bottom: 12px; font-size: 15px; }
  input[type="file"] { display: block; width: 100%; padding: 12px; border: 2px dashed #ddd; border-radius: 6px; cursor: pointer; margin-bottom: 15px; }
  input[type="file"]:focus { outline: none; border-color: #667eea; }
  button { background: #667eea; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s; }
  button:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4); }
  button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
  .message { padding: 12px 16px; border-radius: 6px; margin: 15px 0; font-size: 14px; display: none; }
  .message.show { display: block; animation: slideIn 0.3s ease; }
  .message.info { background: #e0e7ff; color: #1e40af; border-left: 4px solid #1e40af; }
  .message.success { background: #dcfce7; color: #166534; border-left: 4px solid #166534; }
  .message.error { background: #fee2e2; color: #991b1b; border-left: 4px solid #991b1b; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 15px 0; }
  .stat-box { background: #f9f9f9; padding: 15px; border-radius: 6px; text-align: center; border-left: 4px solid #667eea; }
  .stat-number { font-size: 24px; font-weight: bold; color: #667eea; }
  .stat-label { font-size: 12px; color: #666; margin-top: 5px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #f3f3f3; border-top: 2px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .actions button { flex: 1; }
  .actions button.secondary { background: #f0f0f0; color: #333; }
  .actions button.secondary:hover { background: #e0e0e0; }
  .hidden { display: none !important; }
  .progress-bar { width: 100%; height: 4px; background: #eee; border-radius: 2px; margin: 15px 0; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.3s ease; }
</style>
</head>
<body>

<div class="modal">
  <h1>📊 ePilot - Import Excel</h1>
  <p class="subtitle">Importer données Excel directement dans ePilot v20</p>

  <!-- Step 1: Upload -->
  <div class="step">
    <div class="step-title">1️⃣ Sélectionner fichier Excel</div>
    <input type="file" id="excelFile" accept=".xlsx,.xlsm" placeholder="Choisir ePilot.xlsm">
    <button onclick="readExcel()">📖 Lire le fichier</button>
  </div>

  <!-- Message -->
  <div id="message" class="message"></div>

  <!-- Progress -->
  <div id="progress" class="hidden">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Step 2: Preview -->
  <div id="step2" class="step hidden">
    <div class="step-title">2️⃣ Aperçu des données</div>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-number" id="count-chantiers">0</div>
        <div class="stat-label">Chantiers</div>
      </div>
      <div class="stat-box">
        <div class="stat-number" id="count-sourcing">0</div>
        <div class="stat-label">Commandes</div>
      </div>
      <div class="stat-box">
        <div class="stat-number" id="count-factures">0</div>
        <div class="stat-label">Factures</div>
      </div>
    </div>
  </div>

  <!-- Step 3: Actions -->
  <div id="step3" class="step hidden">
    <div class="step-title">3️⃣ Actions</div>
    <div class="actions">
      <button onclick="injectData()" class="primary">✓ Importer dans ePilot</button>
      <button onclick="openEPilot()" class="secondary">→ Ouvrir ePilot</button>
    </div>
  </div>
</div>

<script>
// Global state
let excelData = {
  CHANTIERS_DATA: {},
  SOURCING_DATA: [],
  FACTURES_DATA: []
};

function showMessage(msg, type = 'info') {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.className = `message show ${type}`;
}

function hideMessage() {
  const el = document.getElementById('message');
  el.className = 'message';
}

function showProgress() {
  document.getElementById('progress').classList.remove('hidden');
}

function hideProgress() {
  document.getElementById('progress').classList.add('hidden');
}

function updateProgress(percent) {
  document.getElementById('progressFill').style.width = percent + '%';
}

async function readExcel() {
  const file = document.getElementById('excelFile').files[0];
  if (!file) {
    showMessage('Sélectionner un fichier Excel', 'error');
    return;
  }

  if (!file.name.match(/\.(xlsx|xlsm)$/i)) {
    showMessage('Format invalide. Sélectionner .xlsx ou .xlsm', 'error');
    return;
  }

  showProgress();
  updateProgress(10);
  showMessage('⏳ Lecture du fichier...', 'info');

  try {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        updateProgress(30);
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        updateProgress(50);

        // Process sheets
        processQuote(workbook);
        updateProgress(60);
        processJIP(workbook);
        updateProgress(70);
        processSourcing(workbook);
        updateProgress(80);
        processBill(workbook);
        updateProgress(90);

        // Show results
        updateProgress(100);
        setTimeout(() => {
          hideProgress();
          showMessage(`✅ Données lues: ${Object.keys(excelData.CHANTIERS_DATA).length} Chantiers, ${excelData.SOURCING_DATA.length} Commandes, ${excelData.FACTURES_DATA.length} Factures`, 'success');

          // Update counts
          document.getElementById('count-chantiers').textContent = Object.keys(excelData.CHANTIERS_DATA).length;
          document.getElementById('count-sourcing').textContent = excelData.SOURCING_DATA.length;
          document.getElementById('count-factures').textContent = excelData.FACTURES_DATA.length;

          // Show next steps
          document.getElementById('step2').classList.remove('hidden');
          document.getElementById('step3').classList.remove('hidden');
        }, 500);
      } catch (err) {
        hideProgress();
        showMessage('❌ Erreur: ' + err.message, 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  } catch (err) {
    hideProgress();
    showMessage('❌ Erreur: ' + err.message, 'error');
  }
}

function processQuote(workbook) {
  const ws = workbook.Sheets['Quote'];
  if (!ws) return;

  const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
  const headers = data[8]; // Row 9 (0-indexed = 8)

  for (let i = 9; i < data.length; i++) {
    const row = data[i];
    if (!row || row.every(c => !c)) continue;

    const obj = {};
    headers.forEach((h, idx) => {
      if (h) obj[h.toString().trim()] = row[idx] || null;
    });

    const dossier = obj.Dossier;
    if (dossier && !excelData.CHANTIERS_DATA[dossier]) {
      excelData.CHANTIERS_DATA[dossier] = {
        _id: dossier,
        Imputation: dossier,
        Dossier: dossier,
        _type: 'DEVIS',
        _source: 'DEVIS'
      };
    }

    if (dossier) {
      Object.assign(excelData.CHANTIERS_DATA[dossier], {
        Acheteur: obj.Acheteur,
        RFQ: obj.RFQ,
        DateRFQ: obj.DateRFQ,
        EtatPI: obj.EtatPI,
        Client: excelData.CHANTIERS_DATA[dossier].Client || obj.Client
      });
    }
  }
}

function processJIP(workbook) {
  const ws = workbook.Sheets['JIP'];
  if (!ws) return;

  const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
  const headers = data[6]; // Row 7 (0-indexed = 6)

  for (let i = 7; i < data.length; i++) {
    const row = data[i];
    if (!row || row.every(c => !c)) continue;

    const obj = {};
    headers.forEach((h, idx) => {
      if (h) obj[h.toString().trim()] = row[idx] || null;
    });

    const id = obj.Imputation;
    if (id) {
      excelData.CHANTIERS_DATA[id] = {
        _id: id,
        Imputation: id,
        Unite: obj.Unite,
        Type: obj.Type,
        Date: obj.Date,
        Status: obj.Status || obj.Etat,
        NumeroOA: obj.NumeroOA,
        Client: obj.Client,
        Budget: obj.Budget,
        _source: 'JIP',
        _type: obj.NumeroOA ? 'CHANTIER' : 'DEVIS',
        ...excelData.CHANTIERS_DATA[id]
      };
    }
  }
}

function processSourcing(workbook) {
  const ws = workbook.Sheets['Sourcing'];
  if (!ws) return;

  const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
  const headers = data[6]; // Row 7

  for (let i = 7; i < data.length; i++) {
    const row = data[i];
    if (!row || row.every(c => !c)) continue;

    const obj = {};
    headers.forEach((h, idx) => {
      if (h) obj[h.toString().trim()] = row[idx] || null;
    });

    if (obj.Imputation) {
      excelData.SOURCING_DATA.push({
        _id: `${obj.Imputation}_${obj.Position || obj.Rank}`,
        Imputation: obj.Imputation,
        Description: obj['Description of Equip'],
        Qty: obj.Qty,
        CoutAcqXAF: obj.CoutAcqXAF,
        OA: obj.OA
      });
    }
  }
}

function processBill(workbook) {
  const ws = workbook.Sheets['Bill'];
  if (!ws) return;

  const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
  const headers = data[7]; // Row 8

  for (let i = 8; i < data.length; i++) {
    const row = data[i];
    if (!row || row.every(c => !c)) continue;

    const obj = {};
    headers.forEach((h, idx) => {
      if (h) obj[h.toString().trim()] = row[idx] || null;
    });

    if (obj.Dossier) {
      excelData.FACTURES_DATA.push({
        _id: `${obj.Dossier}_${obj.NumeroFacture}`,
        Dossier: obj.Dossier,
        NumeroFacture: obj.NumeroFacture,
        Montant: obj.Montant,
        Statut: obj.Statut
      });
    }
  }
}

function injectData() {
  showMessage('⏳ Injection dans localStorage...', 'info');

  try {
    const v21DbKey = 'epilot_v21_complete_db';
    let db = JSON.parse(localStorage.getItem(v21DbKey) || '{}');

    // Initialize
    if (!db.CHANTIERS_DATA) db.CHANTIERS_DATA = {};
    if (!db.SOURCING_DATA) db.SOURCING_DATA = [];
    if (!db.FACTURES_DATA) db.FACTURES_DATA = [];

    // Merge
    db.CHANTIERS_DATA = { ...db.CHANTIERS_DATA, ...excelData.CHANTIERS_DATA };
    db.SOURCING_DATA = [...db.SOURCING_DATA, ...excelData.SOURCING_DATA];
    db.FACTURES_DATA = [...db.FACTURES_DATA, ...excelData.FACTURES_DATA];

    localStorage.setItem(v21DbKey, JSON.stringify(db));

    showMessage('✅ Données injectées dans ePilot!', 'success');
  } catch (err) {
    showMessage('❌ Erreur: ' + err.message, 'error');
  }
}

function openEPilot() {
  window.location.href = 'ePilot%20v20_standalone.html';
}
</script>

</body>
</html>
