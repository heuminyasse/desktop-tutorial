<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ePilot JOB - Gestion des Devis & Projets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #B5000A 0%, #8b000a 100%);
    color: white;
    padding: 40px 30px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 30px;
    align-items: center;
  }

  .header-title h1 {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 5px;
  }

  .header-title p {
    opacity: 0.9;
    font-size: 14px;
  }

  .header-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 15px;
  }

  .stat {
    text-align: center;
    padding: 15px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }

  .stat-number {
    font-size: 26px;
    font-weight: bold;
    display: block;
  }

  .stat-label {
    font-size: 11px;
    opacity: 0.9;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #B5000A;
  }

  .row-check {
    margin: 0;
  }

  th input[type="checkbox"] {
    width: 16px;
    height: 16px;
  }

  .controls {
    padding: 20px 30px;
    background: #fafbfc;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid #e0e0e0;
  }

  button {
    background: #B5000A;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: background 0.3s;
  }

  button:hover {
    background: #8b000a;
  }

  button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
  }

  .search-box input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
  }

  .filter-buttons {
    display: flex;
    gap: 8px;
  }

  .filter-btn {
    background: white;
    color: #B5000A;
    border: 2px solid #B5000A;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
  }

  .filter-btn.active {
    background: #B5000A;
    color: white;
  }

  .content {
    padding: 30px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #666;
  }

  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 15px;
  }

  .table-container {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    background: #B5000A;
    color: white;
    padding: 16px 15px;
    text-align: left;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  td {
    padding: 14px 15px;
    border-bottom: 1px solid #e0e0e0;
  }

  tbody tr:hover {
    background: #f0f7ff;
  }

  tbody tr {
    transition: background-color 0.2s;
  }

  .job-id {
    font-weight: bold;
    color: #B5000A;
    cursor: pointer;
  }

  .job-id:hover {
    text-decoration: underline;
  }

  .status-badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
  }

  .status-devis {
    background: #fff3cd;
    color: #856404;
  }

  .status-valide {
    background: #d4edda;
    color: #155724;
  }

  .status-facture {
    background: #cce5ff;
    color: #004085;
  }

  .status-paye {
    background: #d1e7dd;
    color: #0f5132;
  }

  .detail-panel {
    background: #f9f9f9;
    padding: 20px;
    border-radius: 8px;
    margin-top: 20px;
    border-left: 4px solid #B5000A;
    display: none;
  }

  .detail-panel.active {
    display: block;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
  }

  .detail-item {
    background: white;
    padding: 15px;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
  }

  .detail-label {
    font-size: 12px;
    color: #666;
    font-weight: bold;
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .detail-value {
    font-size: 16px;
    font-weight: bold;
    color: #333;
  }

  .detail-section {
    margin-top: 20px;
  }

  .detail-section h3 {
    color: #B5000A;
    font-size: 16px;
    margin-bottom: 10px;
    border-bottom: 2px solid #B5000A;
    padding-bottom: 8px;
  }

  .items-list {
    background: white;
    border-radius: 6px;
    overflow: hidden;
  }

  .item-row {
    padding: 12px 15px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .item-row:last-child {
    border-bottom: none;
  }

  .item-desc {
    flex: 1;
    font-weight: 500;
  }

  .item-qty {
    color: #666;
    margin: 0 20px;
  }

  .item-price {
    color: #B5000A;
    font-weight: bold;
    min-width: 120px;
    text-align: right;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }

  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 20px;
  }

  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    background: white;
    padding: 30px;
    border-radius: 12px;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  .modal-content h2 {
    color: #B5000A;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #333;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  .btn-secondary {
    background: #999;
  }

  .btn-secondary:hover {
    background: #777;
  }

  @media (max-width: 768px) {
    .header {
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .header-title h1 {
      font-size: 24px;
    }

    .header-stats {
      grid-template-columns: repeat(2, 1fr);
    }

    .controls {
      flex-direction: column;
    }

    .search-box {
      width: 100%;
    }

    .search-box input {
      width: 100%;
    }

    .filter-buttons {
      width: 100%;
      flex-wrap: wrap;
    }

    table {
      font-size: 12px;
    }

    th, td {
      padding: 10px;
    }

    .detail-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <h1>📋 ePilot JOB</h1>
      <p>Gestion des Devis & Projets</p>
    </div>
    <div class="header-stats">
      <div class="stat">
        <span class="stat-number" id="totalCount">0</span>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <span class="stat-number" id="devisCount">0</span>
        <div class="stat-label">Devis</div>
      </div>
      <div class="stat">
        <span class="stat-number" id="valideCount">0</span>
        <div class="stat-label">Validés</div>
      </div>
      <div class="stat">
        <span class="stat-number" id="factureCount">0</span>
        <div class="stat-label">Facturés</div>
      </div>
      <div class="stat">
        <span class="stat-number" id="selectedCount">0</span>
        <div class="stat-label">Sélectionnés</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchBox" placeholder="🔍 Rechercher (PI, client, statut...)">
    </div>
    <div class="filter-buttons" style="margin-right: auto;">
      <button class="filter-btn active" onclick="filterByStatus('all')">Tous</button>
      <button class="filter-btn" onclick="filterByStatus('DEVIS')">Devis</button>
      <button class="filter-btn" onclick="filterByStatus('CHANTIER')">Validés</button>
      <button class="filter-btn" onclick="filterByStatus('Facturé')">Facturés</button>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="filter-btn" onclick="selectAll()" style="background: #4CAF50; color: white; border: none;">✓ Tout cocher</button>
      <button class="filter-btn" onclick="deselectAll()" style="background: #ff9800; color: white; border: none;">✗ Décocher</button>
      <button class="filter-btn" onclick="deleteSelected()" style="background: #f44336; color: white; border: none;">🗑️ Supprimer</button>
    </div>
    <button onclick="exportData()">📥 Exporter</button>
    <button onclick="importData()">📤 Importer</button>
  </div>

  <!-- Content -->
  <div class="content">
    <div id="tableContainer"></div>
    <div class="detail-panel" id="detailPanel"></div>
  </div>
</div>

<!-- Modal pour import -->
<div class="modal" id="importModal">
  <div class="modal-content">
    <h2>Importer les Données</h2>
    <div class="form-group">
      <label>Coller les données JSON:</label>
      <textarea id="importText" rows="10" placeholder='{"CHANTIERS_DATA": {...}, ...}'></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeImportModal()">Annuler</button>
      <button onclick="confirmImport()">Importer</button>
    </div>
  </div>
</div>

<script>
// ====== VARIABLES GLOBALES ======
let allData = {};
let allJobs = [];  // Données pour Chantiers-style management
let filteredData = [];
let currentFilter = 'all';
let currentDetailId = null;

// ====== ÉVÉNEMENT DÉMARRAGE ======
window.addEventListener('load', () => {
  loadData();
  loadJobs();
  renderTable();
  updateStats();
});

// ====== FONCTION 1: loadJobs() - Charger les données depuis localStorage ======
function loadJobs() {
  try {
    // Essayer le format Job d'abord
    let jobData = localStorage.getItem('epilot_job_data');
    if (jobData) {
      const parsed = JSON.parse(jobData);
      if (parsed.projects && Array.isArray(parsed.projects)) {
        allJobs = parsed.projects;
        console.log('✓ Données Job chargées:', allJobs.length, 'projets');
        displayJobsTable();
        return;
      }
    }

    // Sinon, essayer le format V21
    const v21Data = localStorage.getItem('epilot_v21_complete_db');
    if (v21Data) {
      const parsed = JSON.parse(v21Data);
      allJobs = Object.values(parsed.CHANTIERS_DATA || {}).map(p => ({
        id: p._id,
        client: p.Client,
        type: p.Type,
        montant: p.Budget,
        statut: p.Status,
        etat: p.etat || '',
        dateRFQ: p.Date,
        acheteur: p.Acheteur
      }));
      console.log('✓ Données V21 chargées:', allJobs.length, 'projets');
      displayJobsTable();
      return;
    }

    console.log('⚠️ Aucune donnée trouvée');
    allJobs = [];
  } catch (e) {
    console.error('❌ Erreur chargement:', e);
    allJobs = [];
  }
}

// ====== FONCTION 2: displayJobsTable() - Afficher le tableau (version Management) ======
function displayJobsTable() {
  const container = document.getElementById('tableContainer');

  if (allJobs.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <p>Aucun projet trouvé</p>
      </div>
    `;
    return;
  }

  let html = `
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAllCb" onchange="toggleSelectAll()" title="Sélectionner tout"></th>
            <th>ID Projet</th>
            <th>Client</th>
            <th>Année</th>
            <th>Type</th>
            <th>Montant</th>
            <th>Statut</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
  `;

  allJobs.forEach((project, idx) => {
    const date = new Date(project.dateRFQ);
    const year = isNaN(date) ? 'N/A' : date.getFullYear();
    const dateStr = isNaN(date) ? project.dateRFQ : date.toLocaleDateString('fr-FR');
    const isOld = year < 2025;
    const bgColor = isOld ? '#fff3e0' : 'white';

    const statusClass = `status-${project.type?.toLowerCase() || 'devis'}`;

    html += `
      <tr style="background: ${bgColor};">
        <td><input type="checkbox" class="row-check" data-id="${project.id}" onchange="updateSelectedCount()"></td>
        <td><span class="job-id" onclick="showDetail('${project.id}')">${project.id}</span></td>
        <td>${project.client || '-'}</td>
        <td><strong>${year}</strong></td>
        <td>${project.type || '-'}</td>
        <td>${formatNumber(project.montant)}</td>
        <td><span class="status-badge ${statusClass}">${project.statut || '-'}</span></td>
        <td>${dateStr}</td>
        <td><button onclick="showDetail('${project.id}')">Détails</button></td>
      </tr>
    `;
  });

  html += '</tbody></table></div>';
  container.innerHTML = html;
}

// ====== FONCTION 3: updateStats() - Mettre à jour statistiques ======
function updateStats() {
  const total = allJobs.length;
  const selected = document.querySelectorAll('.row-check:checked').length;
  const anciens = allJobs.filter(item => {
    const year = new Date(item.dateRFQ).getFullYear();
    return year < 2025;
  }).length;

  document.getElementById('totalCount').textContent = total;
  document.getElementById('selectedCount').textContent = selected;
}

// ====== FONCTION 4: selectAll() - Cocher tous ======
function selectAll() {
  document.querySelectorAll('.row-check').forEach(cb => cb.checked = true);
  updateSelectedCount();
}

// ====== FONCTION 5: deselectAll() - Décocher tous ======
function deselectAll() {
  document.querySelectorAll('.row-check').forEach(cb => cb.checked = false);
  updateSelectedCount();
}

// ====== FONCTION 6: toggleSelectAll() - Synchroniser en-tête ======
function toggleSelectAll() {
  const checked = document.getElementById('selectAllCb').checked;
  document.querySelectorAll('.row-check').forEach(cb => cb.checked = checked);
  updateSelectedCount();
}

// ====== FONCTION 7: deleteSelected() - Supprimer sélectionnés ======
function deleteSelected() {
  const checkboxes = document.querySelectorAll('.row-check:checked');
  if (!checkboxes.length) {
    alert('Sélectionnez au moins un projet');
    return;
  }

  if (!confirm(`Supprimer ${checkboxes.length} projet(s)? Cette action est irréversible!`)) {
    return;
  }

  const idsToDelete = Array.from(checkboxes).map(cb => cb.dataset.id);

  // Supprimer des allJobs
  allJobs = allJobs.filter(job => !idsToDelete.includes(job.id));

  // Supprimer de allData.CHANTIERS_DATA
  idsToDelete.forEach(id => {
    delete allData.CHANTIERS_DATA[id];
  });

  // Sauvegarder dans localStorage
  localStorage.setItem('epilot_job_data', JSON.stringify({ projects: allJobs }));
  localStorage.setItem('epilot_v21_complete_db', JSON.stringify(allData));

  alert(`✓ ${idsToDelete.length} projet(s) supprimé(s)!`);

  displayJobsTable();
  updateStats();
}

// ====== FONCTION HELPER: updateSelectedCount() ======
function updateSelectedCount() {
  const selected = document.querySelectorAll('.row-check:checked').length;
  const selectAllCb = document.getElementById('selectAllCb');
  const allCbs = document.querySelectorAll('.row-check');

  selectAllCb.checked = selected > 0 && selected === allCbs.length;
  document.getElementById('selectedCount').textContent = selected;
}

// ====== FONCTIONS ORIGINALES CONSERVÉES ======
async function loadData() {
  try {
    let jobData = localStorage.getItem('epilot_job_data');
    if (jobData) {
      const parsed = JSON.parse(jobData);
      if (parsed.projects && Array.isArray(parsed.projects)) {
        allData = {
          CHANTIERS_DATA: {},
          SOURCING_DATA: [],
          FACTURES_DATA: []
        };

        parsed.projects.forEach(project => {
          allData.CHANTIERS_DATA[project.id] = {
            _id: project.id,
            _type: project.statut === 'Devis' ? 'DEVIS' : 'CHANTIER',
            Client: project.client,
            Status: project.statut,
            Budget: project.montant || project.montantTotal,
            NumeroOA: project.numeroOA,
            Type: project.type,
            Unite: project.unite,
            Date: project.dateRFQ,
            Description: project.description,
            Acheteur: project.acheteur
          };
        });

        console.log('✓ Données chargées:', Object.keys(allData.CHANTIERS_DATA).length, 'projets');
        applyFilters();
        return;
      }
    }

    const stored = localStorage.getItem('epilot_v21_complete_db');
    if (stored) {
      allData = JSON.parse(stored);
      console.log('✓ Données V21:', Object.keys(allData.CHANTIERS_DATA || {}).length, 'projets');
    } else {
      allData = {
        CHANTIERS_DATA: {},
        SOURCING_DATA: [],
        FACTURES_DATA: []
      };
    }
  } catch (e) {
    console.error('❌ Erreur:', e);
    allData = { CHANTIERS_DATA: {}, SOURCING_DATA: [], FACTURES_DATA: [] };
  }

  applyFilters();
}

function applyFilters() {
  const query = document.getElementById('searchBox').value.toLowerCase();

  filteredData = Object.entries(allData.CHANTIERS_DATA || {})
    .map(([id, project]) => ({ id, ...project }))
    .filter(project => {
      if (currentFilter !== 'all') {
        if (currentFilter === 'Facturé') {
          const hasFacure = (allData.FACTURES_DATA || []).some(f => f.Dossier === project.id);
          if (!hasFacure) return false;
        } else if (project._type !== currentFilter) {
          return false;
        }
      }

      if (query) {
        const text = `${project.id} ${project.Client || ''} ${project.Status || ''}`.toLowerCase();
        if (!text.includes(query)) return false;
      }

      return true;
    })
    .sort((a, b) => (b.Date || '').localeCompare(a.Date || ''));
}

function renderTable() {
  const container = document.getElementById('tableContainer');

  if (filteredData.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <p>Aucun projet trouvé</p>
      </div>
    `;
    return;
  }

  let html = `
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID Projet</th>
            <th>Client</th>
            <th>Statut</th>
            <th>Type</th>
            <th>Budget</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
  `;

  filteredData.forEach(project => {
    const statusClass = `status-${project._type?.toLowerCase() || 'devis'}`;
    const statusText = project._type === 'CHANTIER' ? 'Validé' : 'Devis';

    html += `
      <tr>
        <td><span class="job-id" onclick="showDetail('${project.id}')">${project.id}</span></td>
        <td>${project.Client || '-'}</td>
        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
        <td>${project.Type || '-'}</td>
        <td>${formatNumber(project.Budget)}</td>
        <td>${project.Date || '-'}</td>
        <td><button onclick="showDetail('${project.id}')">Détails</button></td>
      </tr>
    `;
  });

  html += '</tbody></table></div>';
  container.innerHTML = html;
}

function showDetail(id) {
  const project = filteredData.find(p => p.id === id);
  if (!project) return;

  currentDetailId = id;
  const sourcing = (allData.SOURCING_DATA || []).filter(s => s.Imputation === id);
  const factures = (allData.FACTURES_DATA || []).filter(f => f.Dossier === id);

  let html = `<div><button onclick="closeDetail()" style="float: right; background: #999;">✕ Fermer</button><h2>${project.id} - ${project.Client || 'N/A'}</h2></div>`;

  document.getElementById('detailPanel').innerHTML = html;
  document.getElementById('detailPanel').classList.add('active');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('active');
  currentDetailId = null;
}

function filterByStatus(status) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  applyFilters();
  renderTable();
}

document.getElementById('searchBox')?.addEventListener('input', () => {
  applyFilters();
  renderTable();
});

function exportData() {
  const json = JSON.stringify(allData, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ePilot-JOB-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  document.getElementById('importModal').classList.add('active');
}

function closeImportModal() {
  document.getElementById('importModal').classList.remove('active');
  document.getElementById('importText').value = '';
}

function confirmImport() {
  const text = document.getElementById('importText').value;
  try {
    const data = JSON.parse(text);
    allData = data;
    localStorage.setItem('epilot_v21_complete_db', JSON.stringify(allData));
    closeImportModal();
    loadData();
    renderTable();
    updateStats();
    alert('✓ Données importées avec succès!');
  } catch (e) {
    alert('❌ Erreur JSON: ' + e.message);
  }
}

function formatNumber(num) {
  if (!num) return '0';
  return num.toString().replace(/B(?=(d{3})+(?!d))/g, ' ');
}
