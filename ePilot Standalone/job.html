<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ePilot JOB - Gestion des Devis & Projets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #B5000A 0%, #8b000a 100%);
    color: white;
    padding: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header h1 {
    font-size: 28px;
    font-weight: bold;
  }

  .header-stats {
    display: flex;
    gap: 20px;
  }

  .stat {
    text-align: center;
    padding: 10px 20px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
  }

  .stat-number {
    font-size: 24px;
    font-weight: bold;
  }

  .stat-label {
    font-size: 12px;
    opacity: 0.9;
  }

  .controls {
    padding: 20px;
    background: #f8f9fa;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid #e0e0e0;
  }

  button {
    background: #B5000A;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: background 0.3s;
  }

  button:hover {
    background: #8b000a;
  }

  button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
  }

  .search-box input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
  }

  .filter-buttons {
    display: flex;
    gap: 8px;
  }

  .filter-btn {
    background: white;
    color: #B5000A;
    border: 2px solid #B5000A;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
  }

  .filter-btn.active {
    background: #B5000A;
    color: white;
  }

  .content {
    padding: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    background: #f0f0f0;
    padding: 15px;
    text-align: left;
    font-weight: bold;
    border-bottom: 2px solid #B5000A;
    color: #333;
  }

  td {
    padding: 12px 15px;
    border-bottom: 1px solid #e0e0e0;
  }

  tr:hover {
    background: #f9f9f9;
  }

  .job-id {
    font-weight: bold;
    color: #B5000A;
    cursor: pointer;
  }

  .job-id:hover {
    text-decoration: underline;
  }

  .status-badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
  }

  .status-devis {
    background: #fff3cd;
    color: #856404;
  }

  .status-valide {
    background: #d4edda;
    color: #155724;
  }

  .status-facture {
    background: #cce5ff;
    color: #004085;
  }

  .status-paye {
    background: #d1e7dd;
    color: #0f5132;
  }

  .detail-panel {
    background: #f9f9f9;
    padding: 20px;
    border-radius: 8px;
    margin-top: 20px;
    border-left: 4px solid #B5000A;
    display: none;
  }

  .detail-panel.active {
    display: block;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
  }

  .detail-item {
    background: white;
    padding: 15px;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
  }

  .detail-label {
    font-size: 12px;
    color: #666;
    font-weight: bold;
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .detail-value {
    font-size: 16px;
    font-weight: bold;
    color: #333;
  }

  .detail-section {
    margin-top: 20px;
  }

  .detail-section h3 {
    color: #B5000A;
    font-size: 16px;
    margin-bottom: 10px;
    border-bottom: 2px solid #B5000A;
    padding-bottom: 8px;
  }

  .items-list {
    background: white;
    border-radius: 6px;
    overflow: hidden;
  }

  .item-row {
    padding: 12px 15px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .item-row:last-child {
    border-bottom: none;
  }

  .item-desc {
    flex: 1;
    font-weight: 500;
  }

  .item-qty {
    color: #666;
    margin: 0 20px;
  }

  .item-price {
    color: #B5000A;
    font-weight: bold;
    min-width: 120px;
    text-align: right;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }

  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 20px;
  }

  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    background: white;
    padding: 30px;
    border-radius: 12px;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  .modal-content h2 {
    color: #B5000A;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #333;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  .btn-secondary {
    background: #999;
  }

  .btn-secondary:hover {
    background: #777;
  }

  @media (max-width: 768px) {
    .header {
      flex-direction: column;
      gap: 20px;
    }

    .header-stats {
      width: 100%;
      justify-content: space-around;
    }

    .controls {
      flex-direction: column;
    }

    .search-box input {
      width: 100%;
    }

    table {
      font-size: 12px;
    }

    th, td {
      padding: 10px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div>
      <h1>📋 ePilot JOB</h1>
      <p>Gestion des Devis & Projets</p>
    </div>
    <div class="header-stats">
      <div class="stat">
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="devisCount">0</div>
        <div class="stat-label">Devis</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="valideCount">0</div>
        <div class="stat-label">Validés</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="factureCount">0</div>
        <div class="stat-label">Facturés</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchBox" placeholder="🔍 Rechercher (PI, client, statut...)">
    </div>
    <div class="filter-buttons">
      <button class="filter-btn active" onclick="filterByStatus('all')">Tous</button>
      <button class="filter-btn" onclick="filterByStatus('DEVIS')">Devis</button>
      <button class="filter-btn" onclick="filterByStatus('CHANTIER')">Validés</button>
      <button class="filter-btn" onclick="filterByStatus('Facturé')">Facturés</button>
    </div>
    <button onclick="exportData()">📥 Exporter</button>
    <button onclick="importData()">📤 Importer</button>
  </div>

  <!-- Content -->
  <div class="content">
    <div id="tableContainer"></div>
    <div class="detail-panel" id="detailPanel"></div>
  </div>
</div>

<!-- Modal pour import -->
<div class="modal" id="importModal">
  <div class="modal-content">
    <h2>Importer les Données</h2>
    <div class="form-group">
      <label>Coller les données JSON:</label>
      <textarea id="importText" rows="10" placeholder='{"CHANTIERS_DATA": {...}, ...}'></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeImportModal()">Annuler</button>
      <button onclick="confirmImport()">Importer</button>
    </div>
  </div>
</div>

<script>
// État global
let allData = {};
let filteredData = [];
let currentFilter = 'all';
let currentDetailId = null;

// Initialisation
window.addEventListener('load', async () => {
  await loadData();
  renderTable();
  updateStats();
});

// Charger les données
async function loadData() {
  try {
    // Try to load from TSV file first
    try {
      const response = await fetch('devis-data.tsv');
      if (response.ok) {
        const tsvContent = await response.text();
        const lines = tsvContent.trim().split('\n');
        if (lines.length > 1) {
          const headers = lines[0].split('\t').map(h => h.trim());
          allData = {
            CHANTIERS_DATA: {},
            SOURCING_DATA: [],
            FACTURES_DATA: []
          };

          for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split('\t').map(v => v.trim());
            if (values.length === 0 || (values.length === 1 && values[0] === '')) continue;

            const row = {};
            for (let j = 0; j < headers.length && j < values.length; j++) {
              row[headers[j]] = values[j];
            }

            if (row.Devis_ID) {
              const id = row.Devis_ID;
              allData.CHANTIERS_DATA[id] = {
                _id: id,
                _type: row.Statut === 'Devis' ? 'DEVIS' : 'CHANTIER',
                Client: row.Client || '-',
                Status: row.Statut || 'Unknown',
                Budget: row.Montant_HT || '0',
                NumeroOA: row.Numéro_OA || '-',
                Type: row.Type_Travail || '-',
                Unite: row.Unité || '-',
                Date: row.Date_RFQ || '-',
                Description: row.Description || '-',
                Acheteur: row.Acheteur || '-'
              };
            }
          }

          console.log('✓ Données chargées (TSV):', Object.keys(allData.CHANTIERS_DATA).length, 'projets');
          applyFilters();
          return;
        }
      }
    } catch (e) {
      console.log('ℹ️ TSV file not found, trying localStorage:', e.message);
    }

    // Try new format from localStorage
    let jobData = localStorage.getItem('epilot_job_data');
    if (jobData) {
      const parsed = JSON.parse(jobData);
      if (parsed.projects && Array.isArray(parsed.projects)) {
        allData = {
          CHANTIERS_DATA: {},
          SOURCING_DATA: [],
          FACTURES_DATA: []
        };

        parsed.projects.forEach(project => {
          allData.CHANTIERS_DATA[project.id] = {
            _id: project.id,
            _type: project.statut === 'Devis' ? 'DEVIS' : 'CHANTIER',
            Client: project.client,
            Status: project.statut,
            Budget: project.montantTotal || project.montant,
            NumeroOA: project.numeroOA,
            Type: project.type,
            Unite: project.unite,
            Date: project.dateRFQ,
            Description: project.description,
            Acheteur: project.acheteur
          };
        });

        console.log('✓ Données chargées (format job):', Object.keys(allData.CHANTIERS_DATA).length, 'projets');
        applyFilters();
        return;
      }
    }

    // Try old format if new format not found
    const stored = localStorage.getItem('epilot_v21_complete_db');
    if (stored) {
      allData = JSON.parse(stored);
      console.log('✓ Données chargées (format V21):', Object.keys(allData.CHANTIERS_DATA || {}).length, 'projets');
    } else {
      console.log('⚠️ Aucune donnée disponible');
      allData = {
        CHANTIERS_DATA: {},
        SOURCING_DATA: [],
        FACTURES_DATA: []
      };
    }
  } catch (e) {
    console.error('❌ Erreur chargement:', e);
    allData = { CHANTIERS_DATA: {}, SOURCING_DATA: [], FACTURES_DATA: [] };
  }

  applyFilters();
}

// Appliquer les filtres
function applyFilters() {
  const query = document.getElementById('searchBox').value.toLowerCase();

  filteredData = Object.entries(allData.CHANTIERS_DATA || {})
    .map(([id, project]) => ({ id, ...project }))
    .filter(project => {
      // Filtre par statut
      if (currentFilter !== 'all') {
        if (currentFilter === 'Facturé') {
          const hasFacure = (allData.FACTURES_DATA || []).some(f => f.Dossier === project.id);
          if (!hasFacure) return false;
        } else if (project._type !== currentFilter) {
          return false;
        }
      }

      // Filtre par recherche
      if (query) {
        const text = `${project.id} ${project.Client || ''} ${project.Status || ''}`.toLowerCase();
        if (!text.includes(query)) return false;
      }

      return true;
    })
    .sort((a, b) => (b.Date || '').localeCompare(a.Date || ''));
}

// Afficher le tableau
function renderTable() {
  const container = document.getElementById('tableContainer');

  if (filteredData.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <p>Aucun projet trouvé</p>
      </div>
    `;
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>ID Projet</th>
          <th>Client</th>
          <th>Statut</th>
          <th>Type</th>
          <th>Budget</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
  `;

  filteredData.forEach(project => {
    const statusClass = `status-${project._type?.toLowerCase() || 'devis'}`;
    const statusText = project._type === 'CHANTIER' ? 'Validé' : 'Devis';

    html += `
      <tr>
        <td><span class="job-id" onclick="showDetail('${project.id}')">${project.id}</span></td>
        <td>${project.Client || '-'}</td>
        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
        <td>${project.Type || '-'}</td>
        <td>${formatNumber(project.Budget)}</td>
        <td>${project.Date || '-'}</td>
        <td><button onclick="showDetail('${project.id}')">Détails</button></td>
      </tr>
    `;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

// Afficher les détails
function showDetail(id) {
  const project = filteredData.find(p => p.id === id);
  if (!project) return;

  currentDetailId = id;
  const sourcing = (allData.SOURCING_DATA || []).filter(s => s.Imputation === id);
  const factures = (allData.FACTURES_DATA || []).filter(f => f.Dossier === id);

  let html = `
    <div>
      <button onclick="closeDetail()" style="float: right; background: #999;">✕ Fermer</button>
      <h2>${project.id} - ${project.Client || 'N/A'}</h2>

      <div class="detail-grid">
        <div class="detail-item">
          <div class="detail-label">Type</div>
          <div class="detail-value">${project.Type || '-'}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Statut</div>
          <div class="detail-value">${project.Status || '-'}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Budget</div>
          <div class="detail-value">${formatNumber(project.Budget)}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Localisation</div>
          <div class="detail-value">${project.Unite || '-'}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Date</div>
          <div class="detail-value">${project.Date || '-'}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">N° OA</div>
          <div class="detail-value">${project.NumeroOA || '-'}</div>
        </div>
      </div>

      ${sourcing.length > 0 ? `
        <div class="detail-section">
          <h3>Articles Sourcing (${sourcing.length})</h3>
          <div class="items-list">
            ${sourcing.map(item => `
              <div class="item-row">
                <div class="item-desc">${item.Description || '-'}</div>
                <div class="item-qty">Qty: ${item.Qty || 0}</div>
                <div class="item-price">${formatNumber(item.CoutAcqXAF)} XAF</div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}

      ${factures.length > 0 ? `
        <div class="detail-section">
          <h3>Factures (${factures.length})</h3>
          <div class="items-list">
            ${factures.map(f => `
              <div class="item-row">
                <div class="item-desc">${f.NumeroFacture || '-'}</div>
                <div class="item-qty">${f.Statut || '-'}</div>
                <div class="item-price">${formatNumber(f.Montant)} XAF</div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
    </div>
  `;

  document.getElementById('detailPanel').innerHTML = html;
  document.getElementById('detailPanel').classList.add('active');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('active');
  currentDetailId = null;
}

// Filtres
function filterByStatus(status) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  applyFilters();
  renderTable();
}

// Recherche
document.getElementById('searchBox').addEventListener('input', () => {
  applyFilters();
  renderTable();
});

// Stats
function updateStats() {
  const total = Object.keys(allData.CHANTIERS_DATA || {}).length;
  const devis = Object.values(allData.CHANTIERS_DATA || {}).filter(p => p._type === 'DEVIS').length;
  const valide = Object.values(allData.CHANTIERS_DATA || {}).filter(p => p._type === 'CHANTIER').length;
  const facture = new Set((allData.FACTURES_DATA || []).map(f => f.Dossier)).size;

  document.getElementById('totalCount').textContent = total;
  document.getElementById('devisCount').textContent = devis;
  document.getElementById('valideCount').textContent = valide;
  document.getElementById('factureCount').textContent = facture;
}

// Export
function exportData() {
  const json = JSON.stringify(allData, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ePilot-JOB-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// Import
function importData() {
  document.getElementById('importModal').classList.add('active');
}

function closeImportModal() {
  document.getElementById('importModal').classList.remove('active');
  document.getElementById('importText').value = '';
}

function confirmImport() {
  const text = document.getElementById('importText').value;
  try {
    const data = JSON.parse(text);
    allData = data;
    localStorage.setItem('epilot_v21_complete_db', JSON.stringify(allData));
    closeImportModal();
    loadData();
    renderTable();
    updateStats();
    alert('✓ Données importées avec succès!');
  } catch (e) {
    alert('❌ Erreur JSON: ' + e.message);
  }
}

// Utilitaires
function formatNumber(num) {
  if (!num) return '0';
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
</script>
</body>
</html>
