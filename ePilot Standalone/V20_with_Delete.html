<!DOCTYPE html>
<html>
<head>
    <title>V20 - Avec Suppression</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial; }
        #v20-container { display: flex; height: 100vh; }
        #v20-frame { flex: 1; border: none; }
        #delete-panel {
            width: 300px;
            background: #f5f5f5;
            border-left: 1px solid #ddd;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .panel-title { font-size: 14px; font-weight: bold; color: #c41e3a; margin-bottom: 15px; }
        button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .delete-btn { background: #c41e3a; color: white; }
        .delete-btn:hover { background: #a01729; }
        .info-btn { background: #e3f2fd; color: #1565c0; border: 1px solid #2196f3; }
        .info { background: #fff3e0; padding: 10px; border-radius: 4px; font-size: 12px; margin-top: 15px; line-height: 1.4; }
        .stats { background: #f0f0f0; padding: 10px; border-radius: 4px; font-size: 12px; margin-top: 10px; }
        .count { font-weight: bold; color: #c41e3a; }
    </style>
</head>
<body>
    <div id="v20-container">
        <iframe id="v20-frame" src="ePilot v20_standalone.html"></iframe>
        
        <div id="delete-panel">
            <div class="panel-title">🗑️ Gestion Données</div>
            
            <button class="info-btn" onclick="refreshStats()">🔄 Rafraîchir Stats</button>
            
            <div class="stats" id="stats">
                Chargement...
            </div>
            
            <button class="delete-btn" onclick="deleteOldChantiers()">
                ❌ Supprimer Chantiers Anciens
            </button>
            
            <button class="info-btn" onclick="deleteAll()">
                ⚠️ Tout Supprimer
            </button>
            
            <div class="info">
                <strong>Supprimer Chantiers Anciens:</strong><br>
                Enlève tous les chantiers avant 2025<br><br>
                
                <strong>Tout Supprimer:</strong><br>
                Vide complètement localStorage
            </div>
        </div>
    </div>

    <script>
        function getFrameStorage() {
            try {
                return window.localStorage;
            } catch (e) {
                return null;
            }
        }
        
        function refreshStats() {
            const ls = getFrameStorage();
            if (!ls) {
                document.getElementById('stats').innerHTML = 'Erreur: localStorage inaccessible';
                return;
            }
            
            try {
                const jip = JSON.parse(ls.getItem('ePilot_JIP_DATA') || '[]');
                const old = jip.filter(item => {
                    const year = new Date(item.Date).getFullYear();
                    return year < 2025;
                });
                
                document.getElementById('stats').innerHTML = `
                    <strong>Chantiers JIP:</strong><br>
                    Total: <span class="count">${jip.length}</span><br>
                    Avant 2025: <span class="count">${old.length}</span><br>
                    À partir 2025: <span class="count">${jip.length - old.length}</span>
                `;
            } catch (e) {
                document.getElementById('stats').innerHTML = 'Erreur: ' + e.message;
            }
        }
        
        function deleteOldChantiers() {
            const ls = getFrameStorage();
            if (!ls) {
                alert('Erreur: localStorage inaccessible');
                return;
            }
            
            try {
                const jip = JSON.parse(ls.getItem('ePilot_JIP_DATA') || '[]');
                const filtered = jip.filter(item => {
                    const year = new Date(item.Date).getFullYear();
                    return year >= 2025;
                });
                
                const deleted = jip.length - filtered.length;
                
                if (deleted === 0) {
                    alert('Aucun chantier avant 2025');
                    return;
                }
                
                if (!confirm(`Supprimer ${deleted} chantier(s)?\n\n${jip.length} → ${filtered.length}`)) {
                    return;
                }
                
                ls.setItem('ePilot_JIP_DATA', JSON.stringify(filtered));
                alert(`✓ ${deleted} supprimé(s)!\n\nRecharger V20 pour voir les changements.`);
                refreshStats();
                
            } catch (e) {
                alert('Erreur: ' + e.message);
            }
        }
        
        function deleteAll() {
            if (!confirm('ATTENTION: Cela va vider TOUT localStorage!\n\nContinuer?')) return;
            if (!confirm('Êtes-vous SÛR?')) return;
            
            try {
                const ls = getFrameStorage();
                ls.clear();
                alert('✓ localStorage vidé!');
                refreshStats();
            } catch (e) {
                alert('Erreur: ' + e.message);
            }
        }
        
        window.onload = refreshStats;
    </script>
</body>
</html>
