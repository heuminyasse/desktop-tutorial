<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ePilot v21 - ERP Complet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #B5000A;
            --dark: #8B0007;
            --light: #fff5f5;
            --white: #ffffff;
            --text: #333333;
            --border: #e0e0e0;
            --bg: #f5f5f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* LOGIN */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary) 0%, var(--dark) 100%);
        }

        .login-box {
            background: var(--white);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }

        .login-box h1 {
            color: var(--primary);
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s;
            width: 100%;
        }

        .btn:hover {
            background: var(--dark);
        }

        /* MAIN APP */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg);
        }

        /* TOP BAR */
        .top-bar {
            background: var(--white);
            padding: 12px 20px;
            border-bottom: 2px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .pages-nav {
            display: flex;
            gap: 0;
            flex: 1;
            margin: 0 30px;
        }

        .page-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 15px 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .page-btn:hover {
            color: var(--primary);
        }

        .page-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: var(--light);
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .logout-btn:hover {
            background: var(--dark);
        }

        /* MAIN CONTENT */
        .content-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ONGLETS VERTICAUX */
        .onglets-vertical {
            width: 200px;
            background: var(--white);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 10px 0;
        }

        .onglet-btn {
            width: 100%;
            background: none;
            border: none;
            padding: 12px 15px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            border-left: 4px solid transparent;
            transition: all 0.3s;
        }

        .onglet-btn:hover {
            background: var(--light);
            border-left-color: var(--primary);
        }

        .onglet-btn.active {
            background: var(--light);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 600;
        }

        /* CONTENU */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* SOUS-ONGLETS HORIZONTAUX */
        .sous-onglets-container {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .sous-onglet-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px 0;
            font-size: 12px;
            color: #999;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .sous-onglet-btn:hover {
            color: var(--text);
        }

        .sous-onglet-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }

        /* PAGE CONTENT */
        .page-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg);
        }

        /* TABLES */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h3 {
            font-size: 18px;
            color: var(--text);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-primary:hover {
            background: var(--dark);
        }

        .table-container {
            background: var(--white);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9f9f9;
            border-bottom: 2px solid var(--border);
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            color: var(--text);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            background: #e3f2fd;
            color: #1976d2;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-sm:hover {
            background: #bbdefb;
        }

        .btn-delete {
            background: #ffebee !important;
            color: #d32f2f !important;
        }

        .btn-delete:hover {
            background: #ffcdd2 !important;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        /* FORM MODAL */
        .form-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .form-container.show {
            display: flex;
        }

        .form-modal {
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
        }

        .form-modal h3 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 18px;
        }

        .form-modal .form-group input,
        .form-modal .form-group select,
        .form-modal .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            margin-top: 5px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .btn-secondary {
            background: #666;
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-secondary:hover {
            background: #555;
        }

        /* ALERT */
        .alert {
            padding: 15px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .alert.success {
            background: #d1fae5;
            color: #065f46;
        }

        .alert.error {
            background: #fee2e2;
            color: #7f1d1d;
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h1>🔐 ePilot v21</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Utilisateur</label>
                    <input type="text" id="username" name="username" value="admin" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" value="admin" required>
                </div>
                <button type="submit" class="btn">Se connecter</button>
            </form>
        </div>
    </div>

    <!-- APP -->
    <div id="app-screen" class="app-container" style="display: none;">
        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="logo">📊 ePilot v21</div>
            <div class="pages-nav" id="pages-nav"></div>
            <div class="user-section">
                <span id="current-user" style="font-size: 12px; color: #666;"></span>
                <button class="logout-btn" id="logout-btn">Déconnexion</button>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div class="content-wrapper">
            <!-- ONGLETS VERTICAUX -->
            <div class="onglets-vertical" id="onglets-container"></div>

            <!-- MAIN CONTENT -->
            <div class="content-area">
                <!-- SOUS-ONGLETS -->
                <div class="sous-onglets-container" id="sous-onglets-container"></div>

                <!-- PAGE CONTENT -->
                <div class="page-content" id="page-content"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // FIELD SCHEMAS (From v20)
        // ============================================
        const FIELD_SCHEMAS = {
            PERSONNEL_DATA: [
                { name: 'matricule', label: 'Matricule', type: 'text', required: true },
                { name: 'nom', label: 'Nom', type: 'text', required: true },
                { name: 'prenoms', label: 'Prénoms', type: 'text' },
                { name: 'email', label: 'Email', type: 'email' },
                { name: 'telephone', label: 'Téléphone', type: 'text' },
                { name: 'fonction', label: 'Fonction', type: 'text' }
            ],
            CLIENTS_DATA: [
                { name: 'nom', label: 'Nom Entreprise', type: 'text', required: true },
                { name: 'codeClient', label: 'Code Client', type: 'text' },
                { name: 'type', label: 'Type', type: 'text' },
                { name: 'email', label: 'Email', type: 'email' },
                { name: 'telephone', label: 'Téléphone', type: 'text' },
                { name: 'adresse', label: 'Adresse', type: 'text' },
                { name: 'ville', label: 'Ville', type: 'text' },
                { name: 'niu', label: 'NIU', type: 'text' }
            ],
            SITES_DATA: [
                { name: 'nom', label: 'Nom Site', type: 'text', required: true },
                { name: 'adresse', label: 'Adresse', type: 'text' },
                { name: 'ville', label: 'Ville', type: 'text' },
                { name: 'codePostal', label: 'Code Postal', type: 'text' },
                { name: 'telephone', label: 'Téléphone', type: 'text' },
                { name: 'email', label: 'Email', type: 'email' },
                { name: 'type', label: 'Type', type: 'text' }
            ],
            ARTICLES_DATA: [
                { name: 'designation', label: 'Désignation', type: 'text', required: true },
                { name: 'description', label: 'Description', type: 'textarea' },
                { name: 'quantite', label: 'Quantité', type: 'number' },
                { name: 'unite', label: 'Unité', type: 'text' },
                { name: 'prixUnitaire', label: 'Prix Unitaire', type: 'number' },
                { name: 'montantTotal', label: 'Montant Total', type: 'number' }
            ],
            CHANTIERS_DATA: [
                { name: 'numero', label: 'N° Chantier', type: 'text', required: true },
                { name: 'description', label: 'Description', type: 'textarea' },
                { name: 'status', label: 'Statut', type: 'text' },
                { name: 'dateDebut', label: 'Date Début', type: 'date' },
                { name: 'dateFin', label: 'Date Fin', type: 'date' },
                { name: 'budgetOA', label: 'Budget OA', type: 'number' },
                { name: 'budgetContractuel', label: 'Budget Contractuel', type: 'number' }
            ],
            FOURNISSEURS_DATA: [
                { name: 'nom', label: 'Nom', type: 'text', required: true },
                { name: 'type', label: 'Type', type: 'text' },
                { name: 'contact', label: 'Contact', type: 'text' },
                { name: 'tel', label: 'Téléphone', type: 'text' },
                { name: 'email', label: 'Email', type: 'email' },
                { name: 'adresse', label: 'Adresse', type: 'text' }
            ],
            USERS_DATA: [
                { name: 'name', label: 'Nom Utilisateur', type: 'text', required: true },
                { name: 'role', label: 'Rôle', type: 'text', required: true },
                { name: 'password', label: 'Mot de passe', type: 'password', required: true }
            ]
        };

        // ============================================
        // DATABASE STRUCTURE
        // ============================================
        const STRUCTURE = {
            ACCUEIL: { label: '📊 Accueil', onglets: {} },
            PERSONNEL: {
                label: '👥 Personnel',
                onglets: {
                    'Paie': { sous: ['📅 Pointage', '📄 Bulletins', '🗂 Paie', '💳 Crédits', '📋 Contrats'], data: 'PERSONNEL_DATA' },
                    'Congés': { sous: ['Planning', 'Cartes'], data: 'PERSONNEL_DATA' },
                    'Créateur de badges': { sous: [], data: 'PERSONNEL_DATA' },
                    'PDE': { sous: [], data: 'PERSONNEL_DATA' },
                    'RH': { sous: [], data: 'PERSONNEL_DATA' }
                }
            },
            COMPETENCES: {
                label: '🎓 Compétences',
                onglets: {
                    'Mes Certifications': { sous: [], data: 'CERTIFICATIONS_DATA' },
                    'Mes Compétences': { sous: [], data: 'COMPETENCES_DATA' },
                    'University': { sous: ['Class', 'Suivi'], data: 'UNIVERSITY_DATA' },
                    'Mes Procedures': { sous: [], data: 'PROCEDURES_DATA' },
                    'Rapports JSA': { sous: [], data: 'JSA_DATA' },
                    'Exercices': { sous: [], data: 'EXERCICES_DATA' }
                }
            },
            PROJETS: {
                label: '🏗️ Projets',
                onglets: {
                    'Chantiers': { sous: ['Tableau de bord', 'En Cours', 'OA'], data: 'CHANTIERS_DATA' },
                    'RFQ': { sous: ['Tableau de bord', 'RFQ', 'Devis'], data: 'ARTICLES_DATA' },
                    'Finances': { sous: ['Dépenses', 'Dettes', 'PO', 'Colis / In-transit', 'Facturation'], data: 'ARTICLES_DATA' },
                    'Marketing': { sous: ['Pipeline marketing', 'Projet & Stage', 'Meeting'], data: 'ARTICLES_DATA' },
                    'FCR': { sous: [], data: 'ARTICLES_DATA' }
                }
            },
            ARCHIVES: {
                label: '📚 Archives',
                onglets: {
                    'Clients': { sous: ['Clients', 'Sites', 'Acheteurs'], data: 'CLIENTS_DATA' },
                    'Articles': { sous: [], data: 'ARTICLES_DATA' },
                    'Fournisseurs': { sous: [], data: 'FOURNISSEURS_DATA' },
                    'Boutique': { sous: [], data: 'ARTICLES_DATA' },
                    'Papiers': { sous: [], data: 'ARTICLES_DATA' }
                }
            },
            QUETES: {
                label: '📋 Quêtes',
                onglets: {
                    'Tous': { sous: ['À traiter', 'Mes requêtes', 'Tableau de bord'], data: 'QUETES_TOUS_DATA' },
                    'Travaux': { sous: ['À traiter', 'Mes requêtes', 'Tableau de bord'], data: 'QUETES_TRAVAUX_DATA' },
                    'HSE': { sous: ['À traiter', 'Mes requêtes', 'Tableau de bord'], data: 'QUETES_HSE_DATA' },
                    'Achats': { sous: ['À traiter', 'Mes requêtes', 'Tableau de bord'], data: 'QUETES_ACHATS_DATA' },
                    'RH': { sous: ['À traiter', 'Mes requêtes', 'Tableau de bord'], data: 'QUETES_RH_DATA' },
                    'IT': { sous: ['À traiter', 'Mes requêtes', 'Tableau de bord'], data: 'QUETES_IT_DATA' },
                    'Social': { sous: ['À traiter', 'Mes requêtes', 'Tableau de bord'], data: 'QUETES_SOCIAL_DATA' },
                    'Formation': { sous: ['À traiter', 'Mes requêtes', 'Tableau de bord'], data: 'QUETES_FORMATION_DATA' },
                    'Dépenses': { sous: ['À traiter', 'Mes requêtes', 'Tableau de bord'], data: 'QUETES_DEPENSES_DATA' }
                }
            },
            KPI: {
                label: '📈 KPI',
                onglets: {
                    'Tableau de bord': { sous: [], data: 'KPI_TABLEAU_DATA' },
                    'Évaluation': { sous: ['Chantiers terminés', 'Profils employés'], data: 'KPI_EVAL_DATA' }
                }
            },
            PARAMETRES: {
                label: '⚙️ Paramètres',
                onglets: {
                    'Utilisateurs': { sous: [], data: 'USERS_DATA' },
                    'Entreprise': { sous: [], data: 'COMPANY_DATA' },
                    'Sauvegardes': { sous: [], data: 'BACKUP_DATA' },
                    'Notifications': { sous: [], data: 'NOTIFICATIONS_DATA' },
                    'Préférences': { sous: [], data: 'PREFERENCES_DATA' }
                }
            }
        };

        // ============================================
        // APP STATE
        // ============================================
        const app = {
            db: {},
            currentUser: null,
            currentPage: 'ACCUEIL',
            currentOnglet: null,
            currentSousOnglet: null
        };

        // ============================================
        // INITIALIZATION
        // ============================================
        function initializeDatabase() {
            app.db = {
                USERS_DATA: [{ id: 'USR_001', name: 'Admin', role: 'Admin', password: 'admin', created_at: new Date().toISOString() }]
            };

            // Initialize all data tables
            Object.values(STRUCTURE).forEach(page => {
                Object.values(page.onglets).forEach(onglet => {
                    if (onglet.data) {
                        if (!app.db[onglet.data]) {
                            app.db[onglet.data] = [];
                        }
                    }
                });
            });
        }

        function saveToStorage() {
            localStorage.setItem('epilot_v21_complete_db', JSON.stringify(app.db));
        }

        function loadFromStorage() {
            const stored = localStorage.getItem('epilot_v21_complete_db');
            if (stored) {
                app.db = JSON.parse(stored);
                return true;
            }
            return false;
        }

        // ============================================
        // AUTHENTICATION
        // ============================================
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.toLowerCase();
            const password = document.getElementById('password').value;

            const user = app.db.USERS_DATA.find(u =>
                u.name.toLowerCase() === username && u.password === password
            );

            if (user) {
                app.currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                showApp();
                renderUI();
            } else {
                alert('Identifiants incorrects');
            }
        }

        function handleLogout() {
            app.currentUser = null;
            localStorage.removeItem('currentUser');
            location.reload();
        }

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            document.getElementById('current-user').textContent = app.currentUser.name;
        }

        // ============================================
        // UI RENDERING
        // ============================================
        function renderUI() {
            renderPages();
            loadPage('ACCUEIL');
        }

        function renderPages() {
            const nav = document.getElementById('pages-nav');
            nav.innerHTML = '';

            Object.entries(STRUCTURE).forEach(([key, page]) => {
                const btn = document.createElement('button');
                btn.className = 'page-btn' + (key === app.currentPage ? ' active' : '');
                btn.textContent = page.label;
                btn.onclick = () => loadPage(key);
                nav.appendChild(btn);
            });
        }

        function loadPage(pageKey) {
            app.currentPage = pageKey;
            app.currentOnglet = null;
            app.currentSousOnglet = null;

            // Update pages nav
            document.querySelectorAll('.page-btn').forEach(btn => btn.classList.remove('active'));
            event.target?.classList.add('active');

            // Render onglets
            renderOnglets();
        }

        function renderOnglets() {
            const container = document.getElementById('onglets-container');
            container.innerHTML = '';

            const page = STRUCTURE[app.currentPage];
            if (!page || !page.onglets) {
                document.getElementById('sous-onglets-container').innerHTML = '';
                document.getElementById('page-content').innerHTML = '<div class="empty-state">Accueil</div>';
                return;
            }

            Object.entries(page.onglets).forEach(([name, config], idx) => {
                const btn = document.createElement('button');
                btn.className = 'onglet-btn' + (idx === 0 ? ' active' : '');
                btn.textContent = name;
                btn.onclick = () => selectOnglet(name, config);
                container.appendChild(btn);
            });

            // Load first onglet
            const first = Object.entries(page.onglets)[0];
            if (first) {
                selectOnglet(first[0], first[1]);
            }
        }

        function selectOnglet(name, config) {
            app.currentOnglet = name;
            app.currentSousOnglet = config.sous && config.sous.length > 0 ? config.sous[0] : null;

            // Update active onglet
            document.querySelectorAll('.onglet-btn').forEach(btn => btn.classList.remove('active'));
            event.target?.classList.add('active');

            renderSousOnglets(config.sous || []);
            renderContent(config.data || '');
        }

        function renderSousOnglets(sousOnglets) {
            const container = document.getElementById('sous-onglets-container');
            container.innerHTML = '';

            if (sousOnglets.length === 0) return;

            sousOnglets.forEach((name, idx) => {
                const btn = document.createElement('button');
                btn.className = 'sous-onglet-btn' + (idx === 0 ? ' active' : '');
                btn.textContent = name;
                btn.onclick = () => selectSousOnglet(name);
                container.appendChild(btn);
            });
        }

        function selectSousOnglet(name) {
            app.currentSousOnglet = name;

            document.querySelectorAll('.sous-onglet-btn').forEach(btn => btn.classList.remove('active'));
            event.target?.classList.add('active');
        }

        function renderContent(dataTable) {
            const content = document.getElementById('page-content');

            if (!dataTable) {
                content.innerHTML = '<div class="empty-state">✓ Section ' + app.currentOnglet + '</div>';
                return;
            }

            const data = app.db[dataTable] || [];
            const schema = FIELD_SCHEMAS[dataTable] || [];

            let html = `
                <div class="section-header">
                    <h3>${app.currentOnglet}</h3>
                    <button class="btn-primary" onclick="showAddForm('${dataTable}')">+ Ajouter</button>
                </div>
            `;

            if (data.length === 0) {
                html += '<div class="empty-state">Aucun enregistrement</div>';
            } else {
                html += '<div class="table-container"><table><thead><tr>';
                if (schema.length > 0) {
                    schema.slice(0, 3).forEach(field => {
                        html += `<th>${field.label}</th>`;
                    });
                } else {
                    html += '<th>Données</th>';
                }
                html += '<th>Actions</th></tr></thead><tbody>';

                data.forEach(row => {
                    html += '<tr>';
                    if (schema.length > 0) {
                        schema.slice(0, 3).forEach(field => {
                            html += `<td>${row[field.name] || '-'}</td>`;
                        });
                    } else {
                        html += `<td>${JSON.stringify(row).substring(0, 50)}...</td>`;
                    }
                    html += `<td>
                        <div class="action-btns">
                            <button class="btn-sm" onclick="showEditForm('${dataTable}', '${row.id}')">✏️</button>
                            <button class="btn-sm btn-delete" onclick="deleteRecord('${dataTable}', '${row.id}')">🗑️</button>
                        </div>
                    </td></tr>`;
                });
                html += '</tbody></table></div>';
            }

            content.innerHTML = html;
        }

        function showAddForm(dataTable) {
            const schema = FIELD_SCHEMAS[dataTable];
            if (!schema) {
                alert('Schéma non trouvé');
                return;
            }

            const formHtml = `
                <div class="form-container show">
                    <div class="form-modal">
                        <h3>Ajouter ${app.currentOnglet}</h3>
                        <form id="add-form">
                            ${schema.map(field => `
                                <div class="form-group">
                                    <label>${field.label}</label>
                                    <input type="${field.type}" name="${field.name}" ${field.required ? 'required' : ''} placeholder="${field.label}">
                                </div>
                            `).join('')}
                            <div class="form-actions">
                                <button type="button" class="btn-secondary" onclick="this.closest('.form-container').remove()">Annuler</button>
                                <button type="submit" class="btn-primary">Enregistrer</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            const container = document.createElement('div');
            container.innerHTML = formHtml;
            document.body.appendChild(container);

            container.querySelector('#add-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const record = {
                    id: 'REC_' + Math.random().toString(36).substring(7).toUpperCase(),
                    ...Object.fromEntries(formData),
                    created_at: new Date().toISOString()
                };
                app.db[dataTable].push(record);
                saveToStorage();
                container.remove();
                renderContent(dataTable);
            });

            container.querySelector('.form-container').addEventListener('click', (e) => {
                if (e.target === container.querySelector('.form-container')) {
                    container.remove();
                }
            });
        }

        function showEditForm(dataTable, id) {
            const schema = FIELD_SCHEMAS[dataTable];
            const record = app.db[dataTable].find(r => r.id === id);

            if (!schema || !record) {
                alert('Erreur');
                return;
            }

            const formHtml = `
                <div class="form-container show">
                    <div class="form-modal">
                        <h3>Éditer ${app.currentOnglet}</h3>
                        <form id="edit-form">
                            ${schema.map(field => `
                                <div class="form-group">
                                    <label>${field.label}</label>
                                    <input type="${field.type}" name="${field.name}" value="${record[field.name] || ''}" ${field.required ? 'required' : ''}>
                                </div>
                            `).join('')}
                            <div class="form-actions">
                                <button type="button" class="btn-secondary" onclick="this.closest('.form-container').remove()">Annuler</button>
                                <button type="submit" class="btn-primary">Modifier</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            const container = document.createElement('div');
            container.innerHTML = formHtml;
            document.body.appendChild(container);

            container.querySelector('#edit-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const idx = app.db[dataTable].findIndex(r => r.id === id);
                if (idx > -1) {
                    app.db[dataTable][idx] = {
                        ...app.db[dataTable][idx],
                        ...Object.fromEntries(formData),
                        updated_at: new Date().toISOString()
                    };
                    saveToStorage();
                    container.remove();
                    renderContent(dataTable);
                }
            });

            container.querySelector('.form-container').addEventListener('click', (e) => {
                if (e.target === container.querySelector('.form-container')) {
                    container.remove();
                }
            });
        }

        function deleteRecord(dataTable, id) {
            if (!confirm('Êtes-vous sûr?')) return;

            const idx = app.db[dataTable].findIndex(r => r.id === id);
            if (idx > -1) {
                app.db[dataTable].splice(idx, 1);
                saveToStorage();
                renderContent(dataTable);
            }
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            initializeDatabase();
            if (!loadFromStorage()) {
                saveToStorage();
            }

            // Ensure admin user exists
            if (!app.db.USERS_DATA || app.db.USERS_DATA.length === 0) {
                app.db.USERS_DATA = [{ id: 'USR_001', name: 'Admin', role: 'Admin', password: 'admin', created_at: new Date().toISOString() }];
                saveToStorage();
            }

            // Check login
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                app.currentUser = JSON.parse(savedUser);
                showApp();
                renderUI();
            }

            document.getElementById('login-form').addEventListener('submit', handleLogin);
            document.getElementById('logout-btn').addEventListener('click', handleLogout);
        });
    </script>
</body>
</html>
