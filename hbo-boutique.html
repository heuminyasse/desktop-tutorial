<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBO Cameroun — Boutique Équipements Industriels</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #E8A020;
      --primary-d: #C07010;
      --dark: #F5F7FA;
      --d1: #ECEFF3;
      --d2: #FFFFFF;
      --d3: #F1F4F8;
      --txt: #16202E;
      --muted: #5B6675;
      --brd: rgba(16,32,54,0.10);
      --accent: #10A87D;
      --font: 'Outfit', sans-serif;
      --font2: 'Space Grotesk', sans-serif;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--dark); color: var(--txt); font-family: var(--font); }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }
    
    /* ══ NAVBAR ══ */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--brd);
      padding: 0 32px; height: 68px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand { font-size: 16px; font-weight: 700; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-link { font-size: 13px; color: var(--muted); transition: color .2s; }
    .nav-link:hover { color: var(--txt); }
    .nav-link.active { color: var(--primary); font-weight: 600; }
    .nav-cta { padding: 9px 20px; background: var(--primary); border-radius: 9px; color: #000; font-weight: 700; transition: all .2s; }
    .nav-cta:hover { background: #FBBF24; }
    .cart-badge { background: var(--accent); color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
    
    /* ══ BOUTIQUE HEADER ══ */
    .shop-header {
      padding-top: 120px;
      background: linear-gradient(135deg, var(--d1) 0%, var(--d3) 100%);
      padding-bottom: 40px;
      text-align: center;
    }
    .shop-title { font-size: 42px; font-weight: 800; margin-bottom: 12px; }
    .shop-subtitle { font-size: 16px; color: var(--muted); }
    
    /* ══ FILTRES ══ */
    .shop-container { max-width: 1400px; margin: 0 auto; padding: 40px 32px; }
    .filters-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
      padding: 20px;
      background: var(--d2);
      border-radius: 12px;
      border: 1px solid var(--brd);
    }
    .filter-group { display: flex; flex-direction: column; gap: 8px; }
    .filter-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
    .filter-input, .filter-select { 
      padding: 10px 12px; 
      border: 1px solid var(--brd); 
      border-radius: 8px; 
      font-family: var(--font);
      font-size: 13px;
      background: var(--d2);
      color: var(--txt);
    }
    .filter-input:focus, .filter-select:focus { outline: none; border-color: var(--primary); }
    
    /* ══ GRILLE PRODUITS ══ */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .product-card {
      background: var(--d2);
      border: 1px solid var(--brd);
      border-radius: 12px;
      overflow: hidden;
      transition: all .3s;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      border-color: var(--primary);
      box-shadow: 0 12px 32px rgba(20,30,50,0.12);
      transform: translateY(-4px);
    }
    .product-image {
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, var(--d3) 0%, var(--d1) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    .product-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .product-brand { font-size: 10px; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 4px; letter-spacing: .5px; }
    .product-name { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--txt); }
    .product-specs { font-size: 11px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .product-price { font-size: 16px; font-weight: 800; color: var(--primary); }
    .product-add-btn {
      padding: 8px 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }
    .product-add-btn:hover { background: #0a9665; transform: scale(1.05); }
    
    /* ══ PANIER FLOTTANT ══ */
    .cart-sidebar {
      position: fixed;
      right: -380px;
      top: 0;
      width: 380px;
      height: 100vh;
      background: var(--d2);
      border-left: 1px solid var(--brd);
      display: flex;
      flex-direction: column;
      z-index: 900;
      transition: right .3s;
      box-shadow: -8px 0 32px rgba(20,30,50,0.15);
    }
    .cart-sidebar.open { right: 0; }
    .cart-header {
      padding: 20px;
      border-bottom: 1px solid var(--brd);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cart-title { font-size: 16px; font-weight: 700; }
    .cart-close { cursor: pointer; font-size: 20px; }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .cart-item {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px;
      background: var(--d3);
      border-radius: 8px;
      font-size: 12px;
    }
    .cart-item-name { font-weight: 600; }
    .cart-item-qty { display: flex; gap: 4px; align-items: center; margin-top: 4px; }
    .qty-btn { width: 24px; height: 24px; border: 1px solid var(--brd); border-radius: 4px; cursor: pointer; background: white; }
    .cart-item-remove { cursor: pointer; color: #d32f2f; font-weight: 700; }
    .cart-footer {
      padding: 16px;
      border-top: 1px solid var(--brd);
      background: var(--d3);
    }
    .cart-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-bottom: 12px; }
    .cart-actions { display: flex; gap: 8px; }
    .btn { padding: 11px 16px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12px; transition: all .2s; }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-primary:hover { background: #FBBF24; }
    .btn-secondary { background: var(--accent); color: white; border: 1px solid var(--accent); }
    .btn-secondary:hover { background: #0a9665; }
    
    /* ══ MODAL COTATION ══ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal-box {
      background: var(--d2);
      border-radius: 16px;
      padding: 32px;
      width: min(600px, 95vw);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
    .form-input, .form-textarea { width: 100%; padding: 11px 14px; border: 1px solid var(--brd); border-radius: 8px; font-family: var(--font); font-size: 13px; }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--primary); }
    .form-textarea { min-height: 80px; resize: vertical; }
    
    /* ══ UTILS ══ */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>

<!-- ══ NAVBAR ══ -->
<nav>
  <div class="nav-brand">HBO Cameroun</div>
  <div class="nav-links">
    <a href="#accueil" class="nav-link active">Accueil</a>
    <a href="#boutique" class="nav-link">Boutique</a>
    <a href="#contact" class="nav-link">Contact</a>
    <a href="#" class="nav-cta" onclick="openCart(); return false;">
      🛒 Panier <span class="cart-badge" id="cart-count">0</span>
    </a>
  </div>
</nav>

<!-- ══ BOUTIQUE HEADER ══ -->
<section class="shop-header">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 32px;">
    <h1 class="shop-title">Boutique Équipements Industriels</h1>
    <p class="shop-subtitle">Siemens • Schneider Electric • Solutions Électriques Complètes</p>
  </div>
</section>

<!-- ══ FILTRES + PRODUITS ══ -->
<div class="shop-container">
  <div class="filters-bar">
    <div class="filter-group">
      <label class="filter-label">🔍 Recherche</label>
      <input type="text" class="filter-input" id="search-input" placeholder="Nom, SKU, marque..." onkeyup="filterProducts()">
    </div>
    <div class="filter-group">
      <label class="filter-label">📂 Catégorie</label>
      <select class="filter-select" id="category-filter" onchange="filterProducts()">
        <option value="">Toutes les catégories</option>
        <option value="Appareillage">Appareillage électrique</option>
        <option value="Variateurs">Variateurs & Moteurs</option>
        <option value="Automatisme">Automatisme</option>
        <option value="Éclairage">Éclairage Industriel</option>
        <option value="Distribution">Distribution & Protection</option>
        <option value="Énergie">Énergie Renouvelable</option>
        <option value="Sécurité">Sécurité Électrique</option>
        <option value="Câblage">Câblage & Connectique</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">🏢 Marque</label>
      <select class="filter-select" id="brand-filter" onchange="filterProducts()">
        <option value="">Toutes les marques</option>
        <option value="Siemens">Siemens</option>
        <option value="Schneider">Schneider Electric</option>
        <option value="Autre">Autre</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">💱 Devise</label>
      <select class="filter-select" id="currency-select" onchange="updateCurrency()">
        <option value="XAF">XAF (Franc CFA)</option>
        <option value="USD">USD (Dollar)</option>
        <option value="EUR">EUR (Euro)</option>
      </select>
    </div>
  </div>

  <!-- Grille produits -->
  <div class="products-grid" id="products-grid">
    <!-- Rempli par JS -->
  </div>
</div>

<!-- ══ PANIER FLOTTANT ══ -->
<div class="cart-sidebar" id="cart-sidebar">
  <div class="cart-header">
    <div class="cart-title">Panier</div>
    <div class="cart-close" onclick="closeCart()">✕</div>
  </div>
  <div class="cart-items" id="cart-items">
    <div class="empty-state">
      <div class="empty-state-icon">🛒</div>
      Votre panier est vide
    </div>
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total :</span>
      <span id="cart-total">0 XAF</span>
    </div>
    <div class="cart-actions">
      <button class="btn btn-secondary" style="flex:1" onclick="closeCart()">Continuer shopping</button>
      <button class="btn btn-primary" style="flex:1" onclick="openQuotationForm()">Demander Cotation</button>
    </div>
  </div>
</div>

<!-- ══ MODAL COTATION ══ -->
<div class="modal-overlay" id="quotation-modal">
  <div class="modal-box">
    <div class="modal-title">Demande de Cotation</div>
    <form onsubmit="submitQuotation(event)">
      <div class="form-group">
        <label class="form-label">Nom complet</label>
        <input type="text" class="form-input" id="quote-name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="quote-email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Téléphone</label>
        <input type="tel" class="form-input" id="quote-phone">
      </div>
      <div class="form-group">
        <label class="form-label">Entreprise</label>
        <input type="text" class="form-input" id="quote-company">
      </div>
      <div class="form-group">
        <label class="form-label">Message</label>
        <textarea class="form-textarea" id="quote-message" placeholder="Détails supplémentaires..."></textarea>
      </div>
      <div style="display:flex; gap:8px; justify-content:flex-end">
        <button type="button" class="btn btn-secondary" onclick="closeQuotationForm()">Annuler</button>
        <button type="submit" class="btn btn-primary">Envoyer Cotation</button>
      </div>
    </form>
  </div>
</div>

<script>
// ══ DATA ══
let currentCurrency = 'XAF';
const exchangeRates = { XAF: 1, USD: 0.0016, EUR: 0.0015 };

const products = [
  // Appareillage
  { id: 'P001', name: 'Disjoncteur 3VA12 63A', brand: 'Siemens', category: 'Appareillage', price: 185000, specs: '63A, 230V', emoji: '⚡', sku: 'SIE-3VA12-63' },
  { id: 'P002', name: 'Contacteur LC1-D32 24V', brand: 'Schneider', category: 'Appareillage', price: 92000, specs: '32A, 24V DC', emoji: '🔌', sku: 'SCH-LC1D32' },
  { id: 'P003', name: 'Relais Temporisé 24V', brand: 'Siemens', category: 'Appareillage', price: 45000, specs: '0.1-100s, 24V', emoji: '⏱️', sku: 'SIE-REL-24' },
  // Variateurs
  { id: 'P004', name: 'Variateur G120 1.5kW', brand: 'Siemens', category: 'Variateurs', price: 450000, specs: '1.5kW, 1AC 220V', emoji: '⚙️', sku: 'SIE-G120-1.5' },
  { id: 'P005', name: 'Moteur IE3 3kW', brand: 'Schneider', category: 'Variateurs', price: 380000, specs: '3kW, 400V', emoji: '🔄', sku: 'SCH-MOT-3K' },
  // Automatisme
  { id: 'P006', name: 'API S7-1200 CPU', brand: 'Siemens', category: 'Automatisme', price: 920000, specs: 'Compact, 20 entrées', emoji: '💻', sku: 'SIE-S7-1200' },
  { id: 'P007', name: 'Capteur Proximité IP67', brand: 'Schneider', category: 'Automatisme', price: 58000, specs: 'NPN, M18x1', emoji: '📡', sku: 'SCH-CAP-PROX' },
  // Éclairage
  { id: 'P008', name: 'Lampadaire LED 200W', brand: 'Autre', category: 'Éclairage', price: 180000, specs: '200W, 6500K', emoji: '💡', sku: 'LED-200W-PRO' },
  { id: 'P009', name: 'Feu Signalisation 24V', brand: 'Siemens', category: 'Éclairage', price: 95000, specs: 'RGB, 24V', emoji: '🚨', sku: 'SIE-FEU-RGB' },
  // Distribution
  { id: 'P010', name: 'Fusible Ultrarapide 32A', brand: 'Schneider', category: 'Distribution', price: 8500, specs: 'gG 32A, 500V', emoji: '⚔️', sku: 'SCH-FUSE-32' },
  { id: 'P011', name: 'Câble RVT 4mm²', brand: 'Autre', category: 'Distribution', price: 12000, specs: 'Au mètre, 4mm²', emoji: '🔗', sku: 'CABLE-RVT-4' },
  // Énergie
  { id: 'P012', name: 'Panneau Solaire 100Wc', brand: 'Autre', category: 'Énergie', price: 125000, specs: '100W, monocristallin', emoji: '☀️', sku: 'PANEL-100' },
  { id: 'P013', name: 'Batterie Lithium 48V 100Ah', brand: 'Autre', category: 'Énergie', price: 2800000, specs: '48V, 100Ah, LiFePO4', emoji: '🔋', sku: 'BATT-48V-100' },
  // Sécurité
  { id: 'P014', name: 'Disjoncteur Diff. 30mA', brand: 'Siemens', category: 'Sécurité', price: 145000, specs: '2x63A, 30mA', emoji: '🛡️', sku: 'SIE-DIFF-30MA' },
  { id: 'P015', name: 'Parafoudre Type 2', brand: 'Schneider', category: 'Sécurité', price: 82000, specs: '20kA, 400V', emoji: '⚡', sku: 'SCH-PARA-T2' },
  // Câblage
  { id: 'P016', name: 'Connecteur Weidmüller 4 pôles', brand: 'Autre', category: 'Câblage', price: 15000, specs: '4mm², DIN', emoji: '🔩', sku: 'CONN-WEID-4P' },
];

let cart = JSON.parse(localStorage.getItem('hbo-cart')) || [];

// ══ FONCTIONS ══
function renderProducts(filtered = products) {
  const grid = document.getElementById('products-grid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">🔍</div>Aucun produit trouvé</div>';
    return;
  }
  
  grid.innerHTML = filtered.map(p => `
    <div class="product-card">
      <div class="product-image">${p.emoji}</div>
      <div class="product-body">
        <div class="product-brand">${p.brand}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-specs">${p.specs}</div>
        <div class="product-footer">
          <div class="product-price">${formatPrice(p.price)}</div>
          <button class="product-add-btn" onclick="addToCart('${p.id}')">+ Panier</button>
        </div>
      </div>
    </div>
  `).join('');
}

function filterProducts() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const category = document.getElementById('category-filter').value;
  const brand = document.getElementById('brand-filter').value;
  
  const filtered = products.filter(p =>
    (p.name.toLowerCase().includes(search) || p.sku.toLowerCase().includes(search)) &&
    (!category || p.category === category) &&
    (!brand || p.brand === brand)
  );
  
  renderProducts(filtered);
}

function formatPrice(price) {
  const converted = price * exchangeRates[currentCurrency];
  const symbols = { XAF: ' XAF', USD: '$ ', EUR: '€ ' };
  const symbol = symbols[currentCurrency];
  return symbol.startsWith('$') ? `${symbol}${converted.toFixed(0)}` : `${converted.toFixed(0)}${symbol}`;
}

function updateCurrency() {
  currentCurrency = document.getElementById('currency-select').value;
  renderProducts();
  updateCart();
}

function addToCart(productId) {
  const product = products.find(p => p.id === productId);
  const existing = cart.find(c => c.id === productId);
  
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ ...product, qty: 1 });
  }
  
  saveCart();
  updateCart();
  showCartNotification();
}

function saveCart() {
  localStorage.setItem('hbo-cart', JSON.stringify(cart));
}

function updateCart() {
  const items = document.getElementById('cart-items');
  const count = document.getElementById('cart-count');
  const total = document.getElementById('cart-total');
  
  count.textContent = cart.reduce((sum, c) => sum + c.qty, 0);
  
  if (cart.length === 0) {
    items.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🛒</div>Votre panier est vide</div>';
  } else {
    items.innerHTML = cart.map(c => `
      <div class="cart-item">
        <div>
          <div class="cart-item-name">${c.name}</div>
          <div class="cart-item-qty">
            <button class="qty-btn" onclick="updateQty('${c.id}', -1)">−</button>
            <span>${c.qty}</span>
            <button class="qty-btn" onclick="updateQty('${c.id}', 1)">+</button>
          </div>
          <div style="color:var(--primary);font-weight:600;margin-top:4px">${formatPrice(c.price * c.qty)}</div>
          <div class="cart-item-remove" onclick="removeFromCart('${c.id}')">Supprimer</div>
        </div>
      </div>
    `).join('');
  }
  
  const cartTotal = cart.reduce((sum, c) => sum + (c.price * c.qty), 0);
  total.textContent = formatPrice(cartTotal);
}

function updateQty(productId, delta) {
  const item = cart.find(c => c.id === productId);
  if (item) {
    item.qty = Math.max(1, item.qty + delta);
    saveCart();
    updateCart();
  }
}

function removeFromCart(productId) {
  cart = cart.filter(c => c.id !== productId);
  saveCart();
  updateCart();
}

function openCart() {
  document.getElementById('cart-sidebar').classList.add('open');
}

function closeCart() {
  document.getElementById('cart-sidebar').classList.remove('open');
}

function openQuotationForm() {
  if (cart.length === 0) {
    alert('Votre panier est vide');
    return;
  }
  document.getElementById('quotation-modal').classList.add('open');
}

function closeQuotationForm() {
  document.getElementById('quotation-modal').classList.remove('open');
}

function submitQuotation(e) {
  e.preventDefault();
  
  const name = document.getElementById('quote-name').value;
  const email = document.getElementById('quote-email').value;
  const phone = document.getElementById('quote-phone').value;
  const company = document.getElementById('quote-company').value;
  const message = document.getElementById('quote-message').value;
  
  // Récap panier
  const cartRecap = cart.map(c => `${c.qty}x ${c.name} — ${formatPrice(c.price * c.qty)}`).join('\n');
  const cartTotal = formatPrice(cart.reduce((sum, c) => sum + (c.price * c.qty), 0));
  
  const emailBody = `
DEMANDE DE COTATION
═══════════════════════════════════

CLIENT
─────────────────────────────────────
Nom: ${name}
Email: ${email}
Téléphone: ${phone}
Entreprise: ${company}

PANIER
─────────────────────────────────────
${cartRecap}

TOTAL: ${cartTotal}

MESSAGE
─────────────────────────────────────
${message}

═══════════════════════════════════
Demande générée depuis HBO Cameroun - Boutique
  `;
  
  // Génère un email (affichage pour confirmation)
  console.log('Email à envoyer à: sales@hbocameroon.com');
  console.log(emailBody);

  document.body.appendChild(notification);
  setTimeout(() => notification.remove(), 2000);
}
